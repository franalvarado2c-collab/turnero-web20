<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnero Web</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- ENCABEZADO -->
    <h1>Turnero Web</h1>


    <!-- CALENDARIO -->
    <h2>Calendario de turnos</h2>

    <div class="calendario">

        <!-- Encabezados de los días -->
        <div class="dia-header">Lun</div>
        <div class="dia-header">Mar</div>
        <div class="dia-header">Mié</div>

        <!-- Celdas de horarios -->
        <div class="celda">
            9hs<br>
            Libre
        </div>

        <div class="celda ocupada">
            10hs<br>
            Lucas Gonzalez
        </div>

        <div class="celda">
            11hs<br>
            Libre
        </div>

        <div class="celda ocupada">
            12hs<br>
            Ana Maria
        </div>

        <div class="celda">
            13hs<br>
            Libre
        </div>

        <div class="celda ocupada">
            14hs<br>
            Pedro Rojas
        </div>

    </div>


    <!-- FORMULARIO -->
    <h2>Reservar turno</h2>

    <form>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha">

        <label for="hora">Hora:</label>
        <input type="time" id="hora" name="hora">

        <label for="tema">Tema de la reunión:</label>
        <textarea id="tema" name="tema"></textarea>

        <button type="submit">Reservar turno</button>

    </form>

</body>

</html>
